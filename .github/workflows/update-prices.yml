name: Update prices

on:
  schedule:
    - cron: "47 7 * * *"   # every day around 09:47–10:47 Israel time (Victory publishes after ~9:00)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the price downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install il-supermarket-scraper lxml
          python -m playwright install --with-deps chromium || true

      - name: Download today's prices
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python prices/update_prices.py

      - name: Look inside the Kaggle daily copy
        if: ${{ env.KAGGLE_KEY != '' || env.KAGGLE_API_TOKEN != '' }}
        run: |
          python -m pip install --upgrade kaggle
          python prices/explore_kaggle.py || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is its own job: since Nov 2026 GitHub sometimes can't find the page files when the
  # publish step runs a split second after they're uploaded in the same job ("No artifacts named
  # github-pages were found"). A separate job starts later, and if it ever fails, "Re-run failed jobs"
  # publishes the same files again without downloading the prices again.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to list the uploaded files
        run: sleep 20

      - id: deployment
        uses: actions/deploy-pages@v4
