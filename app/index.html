<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groceries</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Groceries">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F2E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A1C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<style>
  :root {
    --bg: #F8F2E8;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --muted: #8A8A8E;
    --line: rgba(60, 60, 67, 0.12);
    --soft: rgba(120, 120, 128, 0.12);
    --accent: #3D9E73;
    --danger: #FF3B30;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    --bottom-h: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A1C;
      --card: #2C2C2E;
      --text: #F2F2F7;
      --muted: #98989F;
      --line: rgba(255, 255, 255, 0.10);
      --soft: rgba(255, 255, 255, 0.10);
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: contain;
  }
  input, textarea, select, button { font: inherit; color: inherit; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  /* Hebrew (or any right-to-left) text shows in its natural direction. */
  input, textarea, .name-text, .note, .chip, .cat-name, .cat-row .label span, .hist-row .main > div:first-child { unicode-bidi: plaintext; }
  input, textarea { text-align: start; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    padding: calc(env(safe-area-inset-top) + 6px) 16px 8px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .toolbar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .actionbar { display: flex; gap: 8px; margin: 8px 0 2px; }
  .act-btn {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow);
    color: var(--accent); font-weight: 600; font-size: 15px; text-align: left;
  }
  .act-btn svg { width: 18px; height: 18px; flex: none; }
  .act-btn:disabled { color: var(--muted); opacity: 0.55; box-shadow: none; }
  .act-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .act-text small { font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-text small:empty { display: none; }
  .toolbar .group { display: flex; gap: 6px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 20px;
    display: grid; place-items: center; color: var(--accent);
    background: var(--card); box-shadow: var(--shadow);
  }
  .icon-btn svg { width: 20px; height: 20px; }
  h1 { font-size: 34px; font-weight: 700; margin: 4px 4px 0; letter-spacing: 0.2px; }

  /* ---------- List ---------- */
  main { padding: 6px 16px calc(var(--bottom-h) + env(safe-area-inset-bottom) + 20px); }
  .empty { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty .big { font-size: 46px; }
  .empty h3 { color: var(--text); margin: 10px 0 4px; font-size: 20px; }
  .cat { margin-top: 16px; }
  .cat-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 4px 4px 8px; text-align: left;
  }
  .cat-name { font-weight: 600; font-size: 17px; flex: 1; }
  .count { color: var(--muted); font-size: 15px; }
  .count.done { color: var(--accent); }
  .cat-add {
    width: 30px; height: 30px; border-radius: 15px; flex: none; display: grid; place-items: center;
    font-size: 22px; font-weight: 500; line-height: 1; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .cat-add:active { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .chev { color: var(--muted); font-size: 13px; transition: transform 0.2s; }
  .empty-cat .chev, .empty-cat .count { display: none; }
  .empty-cat .cat-name { opacity: 0.6; }
  .empty-cat .badge { opacity: 0.55; }
  .empty.small { padding: 18px 20px 4px; }
  /* Room to scroll the last category above the keyboard while adding. */
  body.adding main { padding-bottom: 60vh; }
  html { overflow-anchor: none; } /* the app keeps the typing row in place itself (same on iPhone and elsewhere) */
  .add-row { display: flex; align-items: center; gap: 12px; padding: 7px 6px 7px 14px; min-height: 56px; position: relative; }
  .card > .row + .add-row::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: var(--line); transform: scaleY(0.5); transform-origin: top;
  }
  .check.ghost { border-style: dashed; opacity: 0.6; }
  .add-input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--text);
    background: transparent; border: 0; outline: 0; padding: 8px 0; unicode-bidi: plaintext;
  }
  .add-scan { width: 40px; height: 40px; flex: none; display: grid; place-items: center; color: var(--muted); border-radius: 20px; }
  .add-scan svg { width: 22px; height: 22px; }
  .add-sugg { margin: 0; padding: 0 14px 12px; }
  .add-sugg:empty { display: none; }
  .collapsed .chev { transform: rotate(-90deg); }
  .badge {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: 17px;
  }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 6px 11px 14px; min-height: 56px;
  }
  /* Divider drawn as its own thin layer: a 0.5px border can vanish on iPhone when a taller row (e.g. with a photo) shifts the rows below. */
  .row + .row::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: var(--line); transform: scaleY(0.5); transform-origin: top; pointer-events: none;
  }
  @media (max-resolution: 1.5dppx) { .row + .row::before { transform: none; } }
  .row.dragging::before, .row.dragging + .row::before { opacity: 0; }
  .check {
    width: 26px; height: 26px; border-radius: 13px; flex: none;
    border: 2px solid color-mix(in srgb, var(--muted) 60%, transparent);
    display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700;
    transition: background 0.15s, border-color 0.15s;
  }
  .row.checked .check { background: var(--accent); border-color: var(--accent); }
  .check { position: relative; cursor: pointer; }
  .check::after { content: ''; position: absolute; inset: -14px -12px; } /* a bigger area to tap */
  .inline-name {
    font: inherit; font-weight: 500; color: var(--text); width: 100%; min-width: 0;
    background: var(--soft); border: 0; outline: 0; border-radius: 8px; padding: 4px 8px; margin: -4px -8px;
    unicode-bidi: plaintext;
  }
  .txt { flex: 1; min-width: 0; }
  .name { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.checked .name, .row.checked .note { color: var(--muted); }
  .row.checked .name-text { text-decoration: line-through; }
  .qty { font-size: 14px; padding: 1px 8px; border-radius: 10px; background: var(--soft); font-weight: 400; }
  .star { color: #F5B800; font-size: 13px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .thumb {
    width: 42px; height: 42px; border-radius: 9px; object-fit: cover; flex: none;
    background: var(--soft);
  }
  .row.checked .thumb { opacity: 0.5; }
  .more {
    width: 32px; height: 40px; flex: none; color: var(--muted);
    display: grid; place-items: center; font-size: 20px; letter-spacing: 1px;
  }
  .handle {
    width: 36px; height: 44px; flex: none; margin-left: -4px;
    display: grid; place-items: center; font-size: 24px; color: color-mix(in srgb, var(--muted) 80%, transparent);
    touch-action: none; cursor: grab;
  }
  .row { position: relative; background: var(--card); transition: transform 0.15s ease;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .row.dragging {
    z-index: 3; transition: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    border-radius: 12px;
  }
  .card { overflow: visible; }
  .drop-line { position: absolute; height: 3px; border-radius: 2px; background: var(--accent); z-index: 20; pointer-events: none; }
  .card.drop-target { box-shadow: 0 0 0 2px var(--accent); border-radius: 14px; }
  .cat-head.drop-target { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 12px; }
  .card .row:first-child { border-radius: 14px 14px 0 0; }
  .card .row:last-child { border-radius: 0 0 14px 14px; }
  .card .row:only-child { border-radius: 14px; }

  /* ---------- Bottom area ---------- */
  #bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 0 12px calc(env(safe-area-inset-bottom) + 8px);
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  #bottom > * { pointer-events: auto; }
  .toast {
    display: flex; align-items: center; gap: 12px;
    background: rgba(0, 0, 0, 0.86); color: #fff;
    padding: 13px 18px; border-radius: 26px; margin: 0 4px;
  }
  .toast span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast button { color: #FFD60A; font-weight: 700; }
  .clear-wrap { display: flex; justify-content: flex-end; padding: 0 4px; }
  .pill {
    background: var(--card); color: var(--accent); font-weight: 600; font-size: 15px;
    padding: 9px 14px; border-radius: 20px; box-shadow: var(--shadow);
  }
  .addbar {
    background: var(--card); border-radius: 26px; box-shadow: var(--shadow);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: -2px -14px; padding: 2px 14px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips:empty { display: none; }
  .chip {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 18px; font-size: 15px; font-weight: 500;
    white-space: nowrap;
  }
  .chip.sugg { background: var(--card); border: 1px solid var(--line); }
  .chip-label { color: #F5B800; font-size: 16px; align-self: center; flex: none; }
  .addrow { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .addbar { min-width: 0; overflow: hidden; }
  .field {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
    background: var(--bg); border-radius: 18px; height: 54px; padding: 0 8px 0 16px;
  }
  .field input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font-size: 19px;
  }
  .field button { width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); }
  .field button svg { width: 22px; height: 22px; }
  .plus {
    width: 54px; height: 54px; border-radius: 27px; flex: none;
    background: var(--accent); color: #fff; font-size: 30px; font-weight: 500;
    display: grid; place-items: center; transition: background 0.15s;
  }
  .plus:disabled { background: color-mix(in srgb, var(--muted) 45%, transparent); }

  /* ---------- Sheets ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0, 0, 0, 0.35);
    display: flex; align-items: flex-end; justify-content: center;
    animation: fade 0.2s ease;
  }
  .sheet {
    width: 100%; max-width: 640px; max-height: 92dvh;
    background: var(--bg); border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column;
    animation: up 0.25s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.full { height: 92dvh; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0.6; } }
  .sheet-head {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 16px 10px;
  }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
  .sheet-head .left { justify-self: start; }
  .sheet-head .right { justify-self: end; }
  .link { color: var(--accent); font-size: 17px; }
  .link.strong { font-weight: 600; }
  .link:disabled { opacity: 0.4; }
  .sheet-body {
    overflow-y: auto; padding: 4px 16px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .group-title { color: var(--muted); font-size: 13px; text-transform: uppercase; margin: 18px 6px 6px; letter-spacing: 0.3px; }
  .footnote { color: var(--muted); font-size: 13px; margin: 6px 6px 0; }
  .form { background: var(--card); border-radius: 12px; overflow: hidden; }
  .form > * { border-top: 0.5px solid var(--line); }
  .form > *:first-child { border-top: 0; }
  .form input, .form textarea, .form select {
    width: 100%; border: 0; outline: 0; background: transparent;
    padding: 13px 16px; font-size: 17px;
  }
  .form textarea { resize: none; min-height: 48px; }
  .form select { -webkit-appearance: none; appearance: none; }
  .form .line { display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 16px; }
  .form .line select { width: auto; text-align: right; color: var(--muted); padding-right: 16px; }
  .action {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; text-align: left; font-size: 17px; color: var(--accent);
  }
  .action.danger { color: var(--danger); }
  .action .ico { width: 24px; text-align: center; }
  .preview { width: 100%; max-height: 260px; object-fit: contain; display: block; background: var(--soft); }

  .cat-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 14px;
    position: relative; background: var(--card); transition: transform 0.15s ease;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .cat-row.dragging { z-index: 3; transition: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); border-radius: 12px; }
  .cat-row .label { flex: 1; text-align: left; display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .cat-row .badge-btn { flex: none; padding: 2px; border-radius: 10px; }
  .cat-name-input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; color: var(--text);
    background: transparent; border: 0; outline: 0; padding: 8px 6px; border-radius: 8px;
    unicode-bidi: plaintext;
  }
  .cat-name-input:focus { background: var(--soft); }
  .cat-row .mini {
    width: 34px; height: 34px; border-radius: 10px; background: var(--soft);
    display: grid; place-items: center; color: var(--text); font-size: 15px;
  }
  .cat-row .mini:disabled { opacity: 0.3; }
  .cat-row .mini.del { color: var(--danger); }
  .add-cat { display: flex; align-items: center; padding-right: 10px; }
  .add-cat input { flex: 1; }
  .form.add-cat > * { border-top: 0; }

  .style-preview { text-align: center; padding: 10px 0 4px; }
  .style-preview .badge { width: 80px; height: 80px; border-radius: 22px; font-size: 42px; margin: 0 auto 8px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 16px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .icon-choice { aspect-ratio: 1; border-radius: 12px; background: var(--soft); font-size: 24px; display: grid; place-items: center; }
  .icon-choice.on { outline: 3px solid var(--accent); }
  .reset { display: block; margin: 20px auto 0; color: var(--danger); }

  .tabs { display: flex; background: var(--soft); border-radius: 9px; padding: 2px; margin: 0 0 6px; }
  .tabs button { flex: 1; padding: 7px; border-radius: 7px; font-size: 14px; font-weight: 500; }
  .tabs button.on { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .hist-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .hist-row .who { font-weight: 600; color: var(--text); opacity: 0.75; }
  .hist-row .dot { width: 30px; height: 30px; border-radius: 15px; flex: none; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700; }
  .hist-row .main { flex: 1; min-width: 0; }
  .hist-row .sub { font-size: 13px; color: var(--muted); }
  .small-btn { font-size: 14px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 6px 12px; border-radius: 14px; }
  .add-circle { width: 32px; height: 32px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 22px; display: grid; place-items: center; flex: none; }

  .viewer {
    position: fixed; inset: 0; z-index: 30; background: #000;
    display: flex; align-items: center; justify-content: center;
    animation: fade 0.2s ease;
  }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer button {
    position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px;
    color: #fff; font-weight: 600; font-size: 17px; padding: 8px 12px;
    background: rgba(255,255,255,0.15); border-radius: 18px;
  }
  .banner {
    position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 8px); z-index: 40;
    background: var(--danger); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 15px;
  }
  .loading { text-align: center; color: var(--muted); padding: 80px 20px; }
  h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Sign-in & household screens ---------- */
  body.gated header, body.gated main, body.gated #bottom { display: none; }
  #gate {
    min-height: 100dvh; display: flex; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 30px);
  }
  .gate-card { width: 100%; max-width: 420px; }
  .gate-card h2 { font-size: 30px; margin: 0 0 6px; text-align: center; }
  .gate-sub { text-align: center; color: var(--muted); margin: 0 0 22px; }
  .gate-icon { display: block; width: 84px; height: 84px; border-radius: 20px; margin: 0 auto 16px; box-shadow: var(--shadow); }
  .gate-card .tabs { margin-bottom: 14px; }
  .big-btn {
    display: block; width: 100%; margin-top: 12px; padding: 15px;
    border-radius: 14px; background: var(--accent); color: #fff; font-weight: 600; font-size: 17px;
  }
  .big-btn.secondary { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
  .big-btn:disabled { opacity: 0.5; }
  .gate-link { display: block; margin: 16px auto 0; text-align: center; }
  .gate-link.small { font-size: 15px; }
  .gate-link:disabled { opacity: 0.4; }
  .gate-msg { color: var(--danger); text-align: center; margin-top: 14px; font-size: 15px; min-height: 1em; }
  .gate-msg.ok { color: var(--accent); }
  /* ---------- Barcode scanner ---------- */
  .scanner {
    position: fixed; inset: 0; z-index: 35; background: #000; color: #fff;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .scanner-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0 14px; font-size: 16px; }
  .scanner-close { color: #fff; font-weight: 600; padding: 8px 14px; background: rgba(255,255,255,0.15); border-radius: 18px; flex: none; }
  .scan-area { flex: 1; border-radius: 16px; overflow: hidden; background: #111; position: relative; min-height: 0; }
  .scan-area video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; left: 7%; right: 7%; top: 50%; height: 34%; transform: translateY(-50%);
    border: 3px solid rgba(255,255,255,0.9); border-radius: 14px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,0.35); pointer-events: none;
  }
  .scan-frame.hit { border-color: #34C759; }
  .scanner-msg { text-align: center; padding: 14px 6px 10px; color: rgba(255,255,255,0.8); font-size: 15px; }
  .scan-photo {
    display: block; width: 100%; margin-bottom: 10px; padding: 13px; border-radius: 12px;
    background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; font-size: 16px;
  }
  .manual { display: flex; gap: 8px; }
  .manual input {
    flex: 1; min-width: 0; border: 0; outline: 0; border-radius: 12px; padding: 13px 14px;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 17px;
  }
  .manual button { color: #000; background: #fff; font-weight: 600; padding: 0 18px; border-radius: 12px; }
  .notice {
    position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top) + 12px); z-index: 40;
    background: rgba(0,0,0,0.86); color: #fff; padding: 11px 18px; border-radius: 20px; font-size: 15px;
    max-width: calc(100% - 32px); text-align: center;
  }
  .hint {
    background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 4px 0 8px;
  }
  .price-btn svg { width: 23px; height: 23px; }
  .prices .price-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 0.5px solid var(--line); }
  .prices .price-row:first-child { border-top: 0; }
  .prices .price-row .main { flex: 1; min-width: 0; }
  .prices .store { font-weight: 600; }
  .prices .amount { font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .prices .diff { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .prices .price-row.best { background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
  .prices .price-row.best .amount { color: var(--accent); }
  .prices .price-row.none { opacity: 0.6; }
  .prices .pick { width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
  .prices .pick:first-child { border-top: 0; }
  .prices .pick:active { background: var(--soft); }
  .prices .pick.not-member { opacity: 0.55; }
  .radio { width: 22px; height: 22px; border-radius: 11px; flex: none; border: 2px solid color-mix(in srgb, var(--muted) 60%, transparent); }
  .radio.on { border: 7px solid var(--accent); }
  .prices .pick.picked { box-shadow: inset 3px 0 0 var(--accent); }
  .prices .pick.not-member.picked { opacity: 1; }
  .cat-pick { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 2px 8px; }
  .prices .diff.deal { color: #C2410C; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .prices .diff.deal { color: #FDBA74; } }
  .prices .sale { font-size: 13px; color: #C2410C; margin-top: 3px; overflow-wrap: anywhere; }
  @media (prefers-color-scheme: dark) { .prices .sale { color: #FDBA74; } }
  .best-tag { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); padding: 2px 7px; border-radius: 8px; margin-left: 4px; vertical-align: 2px; }
  .action:disabled { opacity: 0.45; }
  .barcode-num { font-variant-numeric: tabular-nums; letter-spacing: 1px; font-weight: 600; }

  .invite .code {
    text-align: center; font-size: 34px; font-weight: 700; letter-spacing: 4px;
    padding: 18px 10px 14px; font-variant-numeric: tabular-nums;
    -webkit-user-select: text; user-select: text;
  }
</style>
</head>
<body>
  <header>
    <div class="toolbar">
      <div class="group">
        <button class="icon-btn" id="catsBtn" aria-label="Categories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        </button>
        <button class="icon-btn" id="histBtn" aria-label="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 2"/></svg>
        </button>
      </div>
      <div class="group">
        <button class="icon-btn price-btn" id="priceBtn" aria-label="Check a price">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 7v8M10 7v8M13 7v6"/><circle cx="17.6" cy="17.6" r="5.4" fill="currentColor" stroke="none"/><text x="17.6" y="20.6" font-size="8.4" font-weight="700" fill="var(--card)" stroke="none" text-anchor="middle" font-family="Arial, sans-serif">₪</text></svg>
        </button>
        <button class="icon-btn" id="menuBtn" aria-label="More">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>
        </button>
      </div>
    </div>
    <h1 id="title">Groceries</h1>
    <div class="actionbar">
      <button class="act-btn" id="undoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <span class="act-text"><span>Undo</span><small id="undoWhat"></small></span>
      </button>
      <button class="act-btn" id="clearBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span class="act-text"><span id="clearLabel">Clear bought</span></span>
      </button>
    </div>
  </header>

  <div id="gate" hidden></div>

  <main id="list"><div class="loading">Loading…</div></main>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
